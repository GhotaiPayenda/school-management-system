; PHP limits for the container.
;
; The SPA sends JSON bodies, including base64 data URLs for photos, the school
; logo, documents, and SQLite restore files. PHP's built-in post_max_size of
; 8M is smaller than the application's own limits.
;
; Vercel's routing middleware caps proxied bodies at 4 MB regardless of these
; values; these limits apply when the SPA is served by this image directly.

memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

date.timezone = UTC

expose_php = Off
